name: Application checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Code, database and browser checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Require GitHub-hosted runner
        run: test "$RUNNER_ENVIRONMENT" = github-hosted
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run application gates without publishing raw fixture output
        run: |
          for gate in format:check lint typecheck test:unit test:db build test test:flows test:performance; do
            if npm run "$gate" > "$RUNNER_TEMP/application-checks.log" 2>&1; then
              rm -f "$RUNNER_TEMP/application-checks.log"
              echo "$gate: passed. Raw output withheld."
              echo "- $gate: passed" >> "$GITHUB_STEP_SUMMARY"
            else
              rm -f "$RUNNER_TEMP/application-checks.log"
              echo "::error::$gate failed; raw fixture output was withheld."
              echo "- $gate: failed" >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
          done

  local-supabase:
    name: Local Supabase integration
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      TUTOR_MODE: scripted
      LIVE_TUTOR_SMOKE: "false"
    steps:
      - name: Require GitHub-hosted runner
        run: test "$RUNNER_ENVIRONMENT" = github-hosted
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Fresh runner-only project; no linked/hosted project or repository secrets.
      # Wrapper withholds raw CLI/Auth/assertion output and emits allowlisted reports.
      - name: Verify M1 against disposable Supabase
        id: provider
        run: node --import tsx scripts/ci-provider-acceptance.ts
      - name: Retry scoped cleanup even after failure or cancellation
        if: always() && (steps.provider.outcome == 'success' || steps.provider.outcome == 'failure')
        run: node --import tsx scripts/ci-provider-acceptance.ts --cleanup
      - name: Upload sanitised M1 provider evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: studio-m1-provider-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          include-hidden-files: false
          if-no-files-found: warn
          path: |
            test-results/provider-artifacts/acceptance.json
            test-results/provider-artifacts/browser.json
            test-results/provider-artifacts/public-schema.types.ts
            test-results/provider-artifacts/workshop-390.png
            test-results/provider-artifacts/workshop-1440.png
            test-results/provider-artifacts/foundations-390.png
            test-results/provider-artifacts/foundations-1440.png
            test-results/provider-artifacts/foundations-practice-390.png
            test-results/provider-artifacts/foundations-practice-1440.png
            test-results/provider-artifacts/foundations-recap-390.png
            test-results/provider-artifacts/foundations-recap-1440.png
            test-results/provider-artifacts/apis-data-learn-390.png
            test-results/provider-artifacts/apis-data-learn-1440.png
            test-results/provider-artifacts/apis-data-practice-390.png
            test-results/provider-artifacts/apis-data-practice-1440.png
            test-results/provider-artifacts/apis-data-recap-390.png
            test-results/provider-artifacts/apis-data-recap-1440.png
